name: Deploy zu GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Hinweis: "cache: npm" braucht eine committete package-lock.json.
          # Sobald du einmal lokal `npm install` ausgeführt und die dabei
          # entstehende package-lock.json committet/gepusht hast, kannst du
          # hier wieder `cache: 'npm'` eintragen und unten `npm install`
          # durch `npm ci` ersetzen (schneller + reproduzierbar).

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Statischen Export bauen
        run: npm run build

      - name: Export-Ordner hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
